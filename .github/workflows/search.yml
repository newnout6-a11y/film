name: Search trackers

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Search query (movie/show title)"
        required: true
        type: string

concurrency:
  group: search-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  search:
    name: Search
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet "requests>=2.31" "beautifulsoup4>=4.12" "lxml>=4.9"

      - name: Prepare results dir
        run: mkdir -p results

      - name: Search Pirate Bay (apibay)
        if: always()
        continue-on-error: true
        env:
          QUERY: ${{ inputs.query }}
        run: python scripts/search/apibay.py

      - name: Search Rutor
        if: always()
        continue-on-error: true
        env:
          QUERY: ${{ inputs.query }}
        run: python scripts/search/rutor.py

      - name: Search RuTracker
        if: always()
        continue-on-error: true
        env:
          QUERY: ${{ inputs.query }}
          RUTRACKER_USERNAME: ${{ secrets.RUTRACKER_USERNAME }}
          RUTRACKER_PASSWORD: ${{ secrets.RUTRACKER_PASSWORD }}
          # Optional cookies.txt fallback for accounts with 2FA / captcha
          # where login.php POST silently fails.
          RUTRACKER_COOKIES: ${{ secrets.RUTRACKER_COOKIES }}
        run: python scripts/search/rutracker.py

      - name: Search Kinozal
        if: always()
        continue-on-error: true
        env:
          QUERY: ${{ inputs.query }}
          KINOZAL_USERNAME: ${{ secrets.KINOZAL_USERNAME }}
          KINOZAL_PASSWORD: ${{ secrets.KINOZAL_PASSWORD }}
          KINOZAL_COOKIES: ${{ secrets.KINOZAL_COOKIES }}
        run: python scripts/search/kinozal.py

      - name: Search NNM-Club
        if: always()
        continue-on-error: true
        env:
          QUERY: ${{ inputs.query }}
          NNM_USERNAME: ${{ secrets.NNM_USERNAME }}
          NNM_PASSWORD: ${{ secrets.NNM_PASSWORD }}
          NNM_COOKIES: ${{ secrets.NNM_COOKIES }}
        run: python scripts/search/nnmclub.py

      - name: Search Kodik
        if: always()
        continue-on-error: true
        env:
          QUERY: ${{ inputs.query }}
          KODIK_API_TOKEN: ${{ secrets.KODIK_API_TOKEN }}
          KINOPOISK_ID: ${{ secrets.KINOPOISK_ID }}
        run: python scripts/search/kodik.py

      - name: Search VideoCDN
        if: always()
        continue-on-error: true
        env:
          QUERY: ${{ inputs.query }}
          VIDEOCDN_API_TOKEN: ${{ secrets.VIDEOCDN_API_TOKEN }}
          KINOPOISK_ID: ${{ secrets.KINOPOISK_ID }}
        run: python scripts/search/videocdn.py

      - name: Search HDRezka
        if: always()
        continue-on-error: true
        env:
          QUERY: ${{ inputs.query }}
          HDREZKA_COOKIES: ${{ secrets.HDREZKA_COOKIES }}
        run: python scripts/search/hdrezka.py

      - name: Search Bazon
        if: always()
        continue-on-error: true
        env:
          QUERY: ${{ inputs.query }}
          BAZON_API_TOKEN: ${{ secrets.BAZON_API_TOKEN }}
          KINOPOISK_ID: ${{ secrets.KINOPOISK_ID }}
        run: python scripts/search/bazon.py

      - name: Search Kinopoisk (metadata)
        if: always()
        continue-on-error: true
        env:
          QUERY: ${{ inputs.query }}
          KINOPOISK_API_KEY: ${{ secrets.KINOPOISK_API_KEY }}
        run: python scripts/search/kinopoisk.py

      - name: Aggregate results
        if: always()
        env:
          QUERY: ${{ inputs.query }}
        run: python scripts/search/aggregate.py

      - name: Upload search artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: results.json
          retention-days: 1
          if-no-files-found: error
