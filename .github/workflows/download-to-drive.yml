name: Download to Google Drive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct URL or video page to download"
        required: true
        type: string
      filename:
        description: "Optional output filename (without extension for yt-dlp)"
        required: false
        type: string
        default: ""
      subfolder:
        description: "Optional subfolder inside the target Drive folder"
        required: false
        type: string
        default: ""
      mode:
        description: "Downloader: auto | aria2 | ytdlp | curl"
        required: false
        type: choice
        default: "auto"
        options:
          - auto
          - aria2
          - ytdlp
          - curl
      ytdlp_format:
        description: "yt-dlp format selector (only for ytdlp/auto-video)"
        required: false
        type: string
        default: "bv*+ba/b"
      max_size_mb:
        description: "Abort if file is larger than this (MB). 0 = no limit"
        required: false
        type: string
        default: "0"

concurrency:
  group: download-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  beam:
    name: Beam to Drive
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - name: Validate inputs
        id: validate
        env:
          INPUT_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          url="$INPUT_URL"
          if ! [[ "$url" =~ ^https?:// ]]; then
            echo "::error::URL must start with http:// or https://"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "## Beam request" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: \`$url\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Filename: \`${{ inputs.filename }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Subfolder: \`${{ inputs.subfolder }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: \`${{ inputs.mode }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Check secrets are configured
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${GDRIVE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::Repository secret GDRIVE_SERVICE_ACCOUNT is not set. See README for setup."
            exit 1
          fi
          if [ -z "${GDRIVE_FOLDER_ID:-}" ]; then
            echo "::error::Repository secret GDRIVE_FOLDER_ID is not set. See README for setup."
            exit 1
          fi

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends aria2 ffmpeg jq curl ca-certificates >/dev/null
          # rclone (latest stable from rclone.org install script)
          curl -fsSL https://rclone.org/install.sh | sudo bash
          # yt-dlp standalone binary (faster updates than apt)
          sudo curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          rclone version
          yt-dlp --version
          aria2c --version | head -n1

      - name: Configure rclone
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"
          sa_path="$HOME/.config/rclone/sa.json"
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT" > "$sa_path"
          chmod 600 "$sa_path"
          # Sanity check: must be valid JSON with client_email
          if ! jq -e '.client_email' "$sa_path" >/dev/null 2>&1; then
            echo "::error::GDRIVE_SERVICE_ACCOUNT does not look like a valid service account JSON."
            exit 1
          fi
          cat > "$HOME/.config/rclone/rclone.conf" <<EOF
          [gdrive]
          type = drive
          scope = drive
          service_account_file = $sa_path
          root_folder_id = $GDRIVE_FOLDER_ID
          EOF
          echo "Service account: $(jq -r .client_email "$sa_path")"
          rclone --config "$HOME/.config/rclone/rclone.conf" lsd gdrive: || {
            echo "::error::rclone could not list the target Drive folder. Make sure the folder is shared with the service account email."
            exit 1
          }

      - name: Detect downloader
        id: detect
        env:
          MODE: ${{ inputs.mode }}
          URL: ${{ steps.validate.outputs.url }}
        run: |
          set -euo pipefail
          mode="$MODE"
          if [ "$mode" = "auto" ]; then
            # Heuristic: video hosting sites -> ytdlp; direct files -> aria2
            if [[ "$URL" =~ (youtube\.com|youtu\.be|vimeo\.com|tiktok\.com|twitter\.com|x\.com|twitch\.tv|dailymotion\.com|rutube\.ru|vk\.com|bilibili\.com|facebook\.com|instagram\.com) ]]; then
              mode="ytdlp"
            else
              mode="aria2"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Selected downloader: $mode"

      - name: Prepare workspace
        id: workspace
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/beam"
          mkdir -p "$work"
          echo "dir=$work" >> "$GITHUB_OUTPUT"

      - name: Download with aria2
        if: steps.detect.outputs.mode == 'aria2' || steps.detect.outputs.mode == 'curl'
        env:
          URL: ${{ steps.validate.outputs.url }}
          FILENAME: ${{ inputs.filename }}
          MAX_SIZE_MB: ${{ inputs.max_size_mb }}
          MODE: ${{ steps.detect.outputs.mode }}
          WORK: ${{ steps.workspace.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$WORK"
          # Pre-check size if possible
          if [ "${MAX_SIZE_MB:-0}" != "0" ]; then
            size_bytes=$(curl -sIL "$URL" | awk 'tolower($1)=="content-length:" {print $2}' | tr -d '\r' | tail -n1 || true)
            if [ -n "$size_bytes" ]; then
              limit_bytes=$(( MAX_SIZE_MB * 1024 * 1024 ))
              if [ "$size_bytes" -gt "$limit_bytes" ]; then
                echo "::error::File size ${size_bytes} bytes exceeds limit of ${limit_bytes} bytes (max_size_mb=${MAX_SIZE_MB})."
                exit 1
              fi
              echo "Pre-check size: $size_bytes bytes (limit: $limit_bytes bytes)"
            fi
          fi
          out_arg=()
          if [ -n "${FILENAME:-}" ]; then
            out_arg=(-o "$FILENAME")
          fi
          if [ "$MODE" = "curl" ]; then
            target="${FILENAME:-download.bin}"
            curl -fL --retry 5 --retry-delay 2 -o "$target" "$URL"
          else
            aria2c \
              --console-log-level=warn \
              --summary-interval=10 \
              --max-connection-per-server=16 \
              --split=16 \
              --min-split-size=4M \
              --continue=true \
              --auto-file-renaming=false \
              --allow-overwrite=true \
              "${out_arg[@]}" \
              "$URL"
          fi
          ls -lah "$WORK"

      - name: Download with yt-dlp
        if: steps.detect.outputs.mode == 'ytdlp'
        env:
          URL: ${{ steps.validate.outputs.url }}
          FILENAME: ${{ inputs.filename }}
          FORMAT: ${{ inputs.ytdlp_format }}
          MAX_SIZE_MB: ${{ inputs.max_size_mb }}
          WORK: ${{ steps.workspace.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$WORK"
          out_template="%(title)s [%(id)s].%(ext)s"
          if [ -n "${FILENAME:-}" ]; then
            out_template="${FILENAME}.%(ext)s"
          fi
          extra=()
          if [ "${MAX_SIZE_MB:-0}" != "0" ]; then
            extra+=(--max-filesize "${MAX_SIZE_MB}M")
          fi
          yt-dlp \
            --no-progress \
            --newline \
            --concurrent-fragments 8 \
            --retries 10 \
            --fragment-retries 10 \
            --merge-output-format mp4 \
            -f "$FORMAT" \
            -o "$out_template" \
            "${extra[@]}" \
            "$URL"
          ls -lah "$WORK"

      - name: Upload to Google Drive
        id: upload
        env:
          SUBFOLDER: ${{ inputs.subfolder }}
          WORK: ${{ steps.workspace.outputs.dir }}
        run: |
          set -euo pipefail
          dest="gdrive:"
          if [ -n "${SUBFOLDER:-}" ]; then
            # rclone will create missing folders
            dest="gdrive:${SUBFOLDER}"
          fi
          echo "Uploading $WORK -> $dest"
          rclone --config "$HOME/.config/rclone/rclone.conf" \
            copy "$WORK" "$dest" \
            --transfers 8 \
            --checkers 16 \
            --drive-chunk-size 128M \
            --drive-upload-cutoff 128M \
            --stats 10s \
            --stats-one-line \
            --progress=false \
            --log-level INFO

          echo "## Uploaded files" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Name | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            sz=$(stat -c%s "$f")
            human=$(numfmt --to=iec --suffix=B "$sz")
            base=$(basename "$f")
            echo "| \`$base\` | $human |" >> "$GITHUB_STEP_SUMMARY"
          done < <(find "$WORK" -type f)

      - name: Cleanup
        if: always()
        run: |
          rm -f "$HOME/.config/rclone/sa.json" "$HOME/.config/rclone/rclone.conf" || true
          rm -rf "$RUNNER_TEMP/beam" || true
