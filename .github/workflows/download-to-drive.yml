name: Download to Google Drive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the source: video page, direct file, magnet:? or .torrent"
        required: true
        type: string
      filename:
        description: "Optional output filename (without extension for yt-dlp)"
        required: false
        type: string
        default: ""
      subfolder:
        description: "Optional subfolder inside the target Drive folder"
        required: false
        type: string
        default: ""
      quality:
        description: "Quality preset (yt-dlp only): auto | 1080p | 720p | 480p | audio | custom"
        required: false
        type: choice
        default: "auto"
        options:
          - auto
          - 1080p
          - 720p
          - 480p
          - audio
          - custom
      ytdlp_format:
        description: "Custom yt-dlp format selector (only used when quality=custom)"
        required: false
        type: string
        default: ""
      web_ready:
        description: "Make video PWA-streamable: none | remux (faststart, ~30s) | transcode (H.264 720p sidecar, ~realtime) | both"
        required: false
        type: choice
        default: "remux"
        options:
          - none
          - remux
          - transcode
          - both

concurrency:
  group: download-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  beam:
    name: Beam to Drive
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - name: Validate inputs and detect downloader
        id: detect
        env:
          INPUT_URL: ${{ inputs.url }}
          QUALITY: ${{ inputs.quality }}
          CUSTOM_FORMAT: ${{ inputs.ytdlp_format }}
          REAL_DEBRID_API_KEY: ${{ secrets.REAL_DEBRID_API_KEY }}
        run: |
          set -euo pipefail
          url="$INPUT_URL"

          # Accept magnet:?, http(s):// and .torrent URLs.
          mode=""
          if [[ "$url" =~ ^magnet:\? ]]; then
            # Prefer Debrid over raw BitTorrent when a key is available.
            if [ -n "${REAL_DEBRID_API_KEY:-}" ]; then
              mode="debrid"
            else
              mode="torrent"
            fi
          elif [[ "$url" =~ ^https?:// ]]; then
            if [[ "$url" =~ \.torrent($|\?) ]]; then
              mode="torrent"
            elif [[ "$url" =~ (youtube\.com|youtu\.be|vimeo\.com|tiktok\.com|twitter\.com|x\.com|twitch\.tv|dailymotion\.com|rutube\.ru|vk\.com|bilibili\.com|facebook\.com|instagram\.com|ok\.ru|coub\.com|kinopoisk\.ru|hd\.kinopoisk\.ru) ]]; then
              mode="ytdlp"
            elif [[ "$url" =~ \.(mp4|mkv|webm|avi|mov|m4v|mp3|m4a|flac|wav|ogg|opus|zip|rar|7z|iso|pdf|epub|cbr|cbz)($|\?) ]]; then
              mode="aria2"
            else
              # Fall back to yt-dlp for unrecognised pages — it knows ~1000 sites.
              mode="ytdlp"
            fi
          else
            echo "::error::URL must start with http(s):// or magnet:?"
            exit 1
          fi

          # Map the quality preset into a yt-dlp format string. The aria2 and
          # torrent paths ignore this — they download whatever's on the wire.
          format=""
          extract_audio="false"
          case "${QUALITY:-auto}" in
            auto)   format="bv*+ba/b" ;;
            1080p)  format="bv*[height<=1080]+ba/b[height<=1080]" ;;
            720p)   format="bv*[height<=720]+ba/b[height<=720]" ;;
            480p)   format="bv*[height<=480]+ba/b[height<=480]" ;;
            audio)  format="ba/b"; extract_audio="true" ;;
            custom) format="${CUSTOM_FORMAT:-bv*+ba/b}" ;;
            *)      format="bv*+ba/b" ;;
          esac

          {
            echo "url=$url"
            echo "mode=$mode"
            echo "format=$format"
            echo "extract_audio=$extract_audio"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Beam request"
            echo ""
            echo "- URL: \`$url\`"
            echo "- Filename: \`${{ inputs.filename }}\`"
            echo "- Subfolder: \`${{ inputs.subfolder }}\`"
            echo "- Mode: \`$mode\`"
            echo "- Quality: \`${QUALITY:-auto}\`"
            echo "- yt-dlp format: \`$format\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check secrets and pick auth mode
        id: auth
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          # Two ways to authenticate to Drive:
          #   * `oauth` — refresh token (rclone authorize "drive"), uploads
          #     happen as the user, files count against the user's quota.
          #     Required for personal @gmail.com accounts because Service
          #     Accounts have no quota and Shared Drives need Workspace.
          #   * `sa`    — Service Account JSON, only works against a Shared
          #     Drive (Workspace). Kept for legacy / Workspace setups.
          # If both are set, OAuth wins because it's the path that actually
          # works against personal accounts.
          mode=""
          if [ -n "${GDRIVE_OAUTH_TOKEN:-}" ]; then
            mode="oauth"
          elif [ -n "${GDRIVE_SERVICE_ACCOUNT:-}" ]; then
            mode="sa"
          fi
          if [ -z "$mode" ]; then
            echo "::error::Neither GDRIVE_OAUTH_TOKEN nor GDRIVE_SERVICE_ACCOUNT is set. Open the app's settings → «Загрузить ключ Google Drive» and pick OAuth (recommended for personal accounts) or Service Account."
            exit 1
          fi
          # Folder ID is optional in OAuth mode — files land in the user's
          # My Drive root if it's blank. In SA mode we still require it
          # because the SA has no usable root of its own.
          if [ "$mode" = "sa" ] && [ -z "${GDRIVE_FOLDER_ID:-}" ]; then
            echo "::error::Repository secret GDRIVE_FOLDER_ID is required in Service Account mode."
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Drive auth mode: $mode"

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends aria2 ffmpeg jq curl ca-certificates unzip >/dev/null
          # rclone (latest stable from rclone.org install script)
          curl -fsSL https://rclone.org/install.sh | sudo bash
          # yt-dlp standalone binary (faster updates than apt)
          sudo curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp
          # Deno — required by recent yt-dlp for YouTube JS extraction (since
          # YouTube ships obfuscated JS that yt-dlp now executes locally to
          # produce signed stream URLs). Without it some formats are missing
          # and bot-detection trips much more aggressively.
          curl -fsSL https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip \
            -o /tmp/deno.zip
          sudo unzip -o -q /tmp/deno.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/deno
          rm -f /tmp/deno.zip
          rclone version
          yt-dlp --version
          deno --version | head -n1
          aria2c --version | head -n1

      - name: Setup Python (for Drive shared-drive detection)
        if: steps.auth.outputs.mode == 'sa'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect Shared Drive for target folder
        if: steps.auth.outputs.mode == 'sa'
        id: drive_detect
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          # Service Accounts have **no** personal Drive quota. Uploading
          # into a regular My Drive folder fails with `storageQuotaExceeded`
          # even when the folder is shared with the SA, because writes are
          # accounted to the SA's (empty) quota. Files upload successfully
          # only when the destination is a Shared Drive — there the bytes
          # are owned by the Shared Drive itself.
          mkdir -p "$HOME/.config/rclone"
          sa_path="$HOME/.config/rclone/sa.json"
          printf '%s' "$GDRIVE_SERVICE_ACCOUNT" > "$sa_path"
          chmod 600 "$sa_path"
          if ! jq -e '.client_email' "$sa_path" >/dev/null 2>&1; then
            echo "::error::GDRIVE_SERVICE_ACCOUNT does not look like a valid service account JSON."
            exit 1
          fi
          pip install --quiet 'pyjwt[crypto]>=2.8'
          export SA_PATH="$sa_path"
          python scripts/drive/detect_shared_drive.py

      - name: Configure rclone (OAuth)
        if: steps.auth.outputs.mode == 'oauth'
        env:
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          # OAuth path: the secret holds either:
          #   * The JSON `rclone authorize "drive"` prints — using rclone's
          #     well-known public client. No client_id/secret needed in
          #     rclone.conf, rclone falls back to its built-in defaults.
          #   * The JSON our in-app device-code flow produces — using a
          #     user-owned "TVs and Limited Input devices" OAuth client.
          #     In that case GDRIVE_OAUTH_CLIENT_ID and _SECRET MUST be
          #     present, otherwise rclone will try to refresh the access
          #     token against its built-in client and Google will return
          #     `invalid_client`.
          # Either way the JSON looks like:
          #   {"access_token":"...","token_type":"Bearer",
          #    "refresh_token":"...","expiry":"..."}
          mkdir -p "$HOME/.config/rclone"
          token_json="$GDRIVE_OAUTH_TOKEN"
          if ! printf '%s' "$token_json" | jq -e '.refresh_token' >/dev/null 2>&1; then
            echo "::error::GDRIVE_OAUTH_TOKEN does not contain a refresh_token. Re-connect Drive in the app («Подключить Google Drive») or re-run \`rclone authorize \"drive\"\` and update the secret."
            exit 1
          fi
          {
            printf '%s\n' '[gdrive]'
            printf '%s\n' 'type = drive'
            if [ -n "${GDRIVE_OAUTH_CLIENT_ID:-}" ]; then
              printf '%s\n' 'scope = drive.file'
              printf 'client_id = %s\n' "$GDRIVE_OAUTH_CLIENT_ID"
            else
              printf '%s\n' 'scope = drive'
            fi
            if [ -n "${GDRIVE_OAUTH_CLIENT_SECRET:-}" ]; then
              printf 'client_secret = %s\n' "$GDRIVE_OAUTH_CLIENT_SECRET"
            fi
            printf 'token = %s\n' "$token_json"
            if [ -n "${GDRIVE_FOLDER_ID:-}" ]; then
              printf 'root_folder_id = %s\n' "$GDRIVE_FOLDER_ID"
            fi
          } > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          if [ -n "${GDRIVE_OAUTH_CLIENT_ID:-}" ]; then
            echo "Drive auth: OAuth (custom client, in-app device flow). Writes count against your personal quota."
          else
            echo "Drive auth: OAuth (rclone built-in client). Writes count against your personal quota."
          fi
          rclone --config "$HOME/.config/rclone/rclone.conf" about gdrive: 2>/dev/null | sed -n '1,8p' || true
          rclone --config "$HOME/.config/rclone/rclone.conf" lsd gdrive: >/dev/null || {
            echo "::error::rclone could not list the target Drive folder. The refresh token may have been revoked or the folder ID is wrong. Re-connect Drive in the app («Подключить Google Drive») to refresh the token."
            exit 1
          }

      - name: Configure rclone (Service Account)
        if: steps.auth.outputs.mode == 'sa'
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TEAM_DRIVE_ID: ${{ steps.drive_detect.outputs.team_drive_id }}
        run: |
          set -euo pipefail
          sa_path="$HOME/.config/rclone/sa.json"
          # Use printf rather than a heredoc to avoid YAML/heredoc whitespace traps.
          {
            printf '%s\n' '[gdrive]'
            printf '%s\n' 'type = drive'
            printf '%s\n' 'scope = drive'
            printf 'service_account_file = %s\n' "$sa_path"
            printf 'root_folder_id = %s\n' "$GDRIVE_FOLDER_ID"
            if [ -n "${TEAM_DRIVE_ID:-}" ]; then
              # team_drive enables Shared Drive ops (the only path where
              # SA uploads don't 403 with storageQuotaExceeded).
              printf 'team_drive = %s\n' "$TEAM_DRIVE_ID"
            fi
          } > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          echo "Service account: $(jq -r .client_email "$sa_path")"
          if [ -n "${TEAM_DRIVE_ID:-}" ]; then
            echo "Using Shared Drive: $TEAM_DRIVE_ID"
          fi
          rclone --config "$HOME/.config/rclone/rclone.conf" lsd gdrive: || {
            echo "::error::rclone could not list the target Drive folder. Make sure the folder is shared with the service account email."
            exit 1
          }

      - name: Prepare workspace
        id: workspace
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/beam"
          mkdir -p "$work"
          echo "dir=$work" >> "$GITHUB_OUTPUT"

      - name: Download with aria2 (direct)
        if: steps.detect.outputs.mode == 'aria2'
        env:
          URL: ${{ steps.detect.outputs.url }}
          FILENAME: ${{ inputs.filename }}
          WORK: ${{ steps.workspace.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$WORK"
          out_arg=()
          if [ -n "${FILENAME:-}" ]; then
            out_arg=(-o "$FILENAME")
          fi
          aria2c \
            --console-log-level=warn \
            --summary-interval=10 \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=4M \
            --continue=true \
            --auto-file-renaming=false \
            --allow-overwrite=true \
            "${out_arg[@]}" \
            "$URL"
          ls -lah "$WORK"

      - name: Download with aria2 (BitTorrent)
        if: steps.detect.outputs.mode == 'torrent'
        env:
          URL: ${{ steps.detect.outputs.url }}
          WORK: ${{ steps.workspace.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$WORK"
          # A modest tracker list helps DHT-only magnets bootstrap faster.
          trackers="udp://tracker.opentrackr.org:1337/announce,udp://open.demonii.com:1337/announce,udp://open.stealth.si:80/announce,udp://exodus.desync.com:6969/announce,udp://tracker.torrent.eu.org:451/announce,udp://tracker.openbittorrent.com:6969/announce"
          aria2c \
            --console-log-level=warn \
            --summary-interval=5 \
            --bt-metadata-only=false \
            --bt-remove-unselected-file=true \
            --enable-dht=true \
            --enable-dht6=false \
            --enable-peer-exchange=true \
            --bt-enable-lpd=true \
            --bt-tracker="$trackers" \
            --bt-save-metadata=true \
            --bt-stop-timeout=600 \
            --timeout=60 \
            --connect-timeout=30 \
            --lowest-speed-limit=1K \
            --seed-time=0 \
            --listen-port=6881-6891 \
            --dht-listen-port=6881-6891 \
            --max-connection-per-server=16 \
            --split=16 \
            --continue=true \
            "$URL" || {
              code=$?
              echo "::error::BitTorrent did not download data. Usually this means the magnet has no active seeders or metadata never arrived; try another result with more 🌱 seeds or add Real-Debrid."
              exit "$code"
            }
          # Drop aria2 control files; we don't want them on Drive.
          find "$WORK" -name '*.aria2' -type f -delete || true
          # If the torrent was a single file, leave it; if it was a folder,
          # rclone copy will recurse — both work.
          ls -lahR "$WORK"

      - name: Download via Real-Debrid (magnet → DDL → Drive)
        if: steps.detect.outputs.mode == 'debrid'
        id: debrid
        env:
          MAGNET: ${{ steps.detect.outputs.url }}
          REAL_DEBRID_API_KEY: ${{ secrets.REAL_DEBRID_API_KEY }}
          SUBFOLDER: ${{ inputs.subfolder }}
          FILENAME: ${{ inputs.filename }}
        run: |
          set -euo pipefail
          # Install Python deps for the Debrid script.
          pip install --quiet "requests>=2.31" 2>/dev/null || true

          # Run the Debrid script — it outputs the DDL URL.
          ddl_url="$(python scripts/debrid/real_debrid.py)"
          if [ -z "$ddl_url" ]; then
            echo "::error::Real-Debrid returned an empty DDL URL"
            exit 1
          fi
          echo "ddl_url=$ddl_url" >> "$GITHUB_OUTPUT"
          echo "Debrid DDL URL obtained (${#ddl_url} chars)"

          # Determine the target path in Drive.
          dest="gdrive:"
          if [ -n "${SUBFOLDER:-}" ]; then
            dest="gdrive:${SUBFOLDER}"
          fi

          # If a filename was specified, use it; otherwise let rclone
          # derive it from the URL (which usually includes a hash).
          filename_arg=()
          if [ -n "${FILENAME:-}" ]; then
            # rclone copyurl needs the full remote path with filename.
            dest="${dest}/${FILENAME}"
          fi

          # Stream the DDL URL directly to Google Drive via rclone copyurl.
          # This completely bypasses local disk I/O — the file never touches
          # the runner's ephemeral storage.  For cached (popular) torrents
          # the Debrid CDN saturates the runner's bandwidth at hundreds of
          # MB/s over HTTPS, no P2P involved.
          echo "Streaming DDL → Drive: $dest"
          rclone --config "$HOME/.config/rclone/rclone.conf" \
            copyurl "$ddl_url" "$dest" \
            --transfers 1 \
            --drive-chunk-size 256M \
            --drive-acknowledge-abuse=true \
            --drive-stop-on-upload-limit \
            --tpslimit 10 \
            --tpslimit-burst 20 \
            --retries 3 \
            --retries-sleep 60s \
            --stats 10s \
            --stats-one-line \
            --progress=false \
            --log-level INFO

          {
            echo "## Загружено через Real-Debrid"
            echo ""
            echo "Magnet-ссылка была конвертирована в кэшированный DDL через Real-Debrid"
            echo "и напрямую стримится в Google Drive (без записи на локальный диск)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download with yt-dlp
        if: steps.detect.outputs.mode == 'ytdlp'
        env:
          URL: ${{ steps.detect.outputs.url }}
          FILENAME: ${{ inputs.filename }}
          FORMAT: ${{ steps.detect.outputs.format }}
          EXTRACT_AUDIO: ${{ steps.detect.outputs.extract_audio }}
          WORK: ${{ steps.workspace.outputs.dir }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          KINOPOISK_COOKIES: ${{ secrets.KINOPOISK_COOKIES }}
        run: |
          set -euo pipefail
          cd "$WORK"
          out_template="%(title)s [%(id)s].%(ext)s"
          if [ -n "${FILENAME:-}" ]; then
            out_template="${FILENAME}.%(ext)s"
          fi
          extra=()
          if [ "${EXTRACT_AUDIO:-false}" = "true" ]; then
            extra+=(--extract-audio --audio-format mp3 --audio-quality 0)
          else
            extra+=(--merge-output-format mp4)
          fi

          # YouTube hardened bot-detection in 2025: the default `web` player
          # client almost always trips the "Sign in to confirm you're not a
          # bot" wall on cloud IPs. Try the `tv_simply` / `mweb` / `ios`
          # clients first — those use mobile/TV API endpoints that don't
          # require a logged-in session for most public videos.
          extra+=(--extractor-args "youtube:player_client=tv_simply,mweb,ios,web_safari")

          # Optional cookies fallback. If the user uploaded a cookies.txt
          # via the in-app uploader (secret: YT_COOKIES), use it. This is
          # the only thing that reliably defeats hard bot-checks on
          # rate-limited / age-gated content.
          # For Kinopoisk URLs, KINOPOISK_COOKIES takes precedence (Firefox
          # cookies are required because Chrome's app-bound encryption
          # prevents cookie extraction in CI/CD).
          cookies_file=""
          if [[ "$URL" =~ kinopoisk\.ru ]] && [ -n "${KINOPOISK_COOKIES:-}" ]; then
            cookies_file="$HOME/.config/yt-dlp/kinopoisk_cookies.txt"
            mkdir -p "$(dirname "$cookies_file")"
            printf '%s' "$KINOPOISK_COOKIES" > "$cookies_file"
            chmod 600 "$cookies_file"
            extra+=(--cookies "$cookies_file")
            extra+=(--remote-components ejs:github)
            echo "Using KINOPOISK_COOKIES from secret ($(wc -l < "$cookies_file") lines)."
            echo "Enabled Deno JS engine for Cloudflare challenge bypass."
          elif [ -n "${YT_COOKIES:-}" ]; then
            cookies_file="$HOME/.config/yt-dlp/cookies.txt"
            mkdir -p "$(dirname "$cookies_file")"
            printf '%s' "$YT_COOKIES" > "$cookies_file"
            chmod 600 "$cookies_file"
            extra+=(--cookies "$cookies_file")
            echo "Using YT_COOKIES from secret ($(wc -l < "$cookies_file") lines)."
          fi

          set +e
          yt-dlp \
            --no-progress \
            --newline \
            --concurrent-fragments 8 \
            --retries 10 \
            --fragment-retries 10 \
            -f "$FORMAT" \
            -o "$out_template" \
            "${extra[@]}" \
            "$URL"
          ytdlp_rc=$?
          set -e

          # Best-effort cleanup of cookies on disk.
          if [ -n "$cookies_file" ] && [ -f "$cookies_file" ]; then
            shred -u "$cookies_file" 2>/dev/null || rm -f "$cookies_file"
          fi

          if [ "$ytdlp_rc" -ne 0 ]; then
            {
              echo "## yt-dlp failed (exit $ytdlp_rc)"
              echo ""
              if [ -z "${YT_COOKIES:-}" ] && [[ "$URL" =~ (youtube\.com|youtu\.be) ]]; then
                echo "YouTube часто требует авторизации с runner-IP («Sign in to confirm you're not a bot»)."
                echo "Решение: в настройках приложения открой раздел «Куки YouTube» и загрузи свой \`cookies.txt\`."
                echo "Любое расширение типа *Get cookies.txt LOCALLY* в Chrome/Firefox экспортирует его за пару кликов."
                echo "Файл попадёт в репозиторный секрет \`YT_COOKIES\` и используется только этим воркфлоу."
              elif [[ "$URL" =~ kinopoisk\.ru ]] && [ -z "${KINOPOISK_COOKIES:-}" ]; then
                echo "Кинопоиск требует авторизации для доступа к видео по подписке."
                echo "Решение: в настройках приложения открой раздел «Куки Кинопоиска» и загрузи \`cookies.txt\` из Firefox."
                echo "Chrome не подходит — app-bound encryption не даёт расшифровать куки в CI/CD."
                echo "Файл попадёт в репозиторный секрет \`KINOPOISK_COOKIES\`."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$ytdlp_rc"
          fi
          ls -lah "$WORK"

      - name: Make videos PWA-streamable (faststart remux + optional 720p sidecar)
        if: steps.detect.outputs.mode == 'ytdlp' || steps.detect.outputs.mode == 'torrent' || steps.detect.outputs.mode == 'aria2'
        env:
          WORK: ${{ steps.workspace.outputs.dir }}
          WEB_READY: ${{ inputs.web_ready }}
        run: |
          set -euo pipefail
          mode="${WEB_READY:-remux}"
          if [ "$mode" = "none" ]; then
            echo "web_ready=none: skipping post-process"
            exit 0
          fi
          cd "$WORK"
          shopt -s nullglob nocaseglob

          # Detect video files. We look at both extension and ffprobe to
          # avoid touching audio/archives/etc. Sidecar files we ourselves
          # produce (*.web.mp4 / *.lite.mp4) are skipped on re-runs.
          videos=()
          for f in *.mp4 *.mkv *.avi *.mov *.m4v *.webm *.ts; do
            [ -f "$f" ] || continue
            case "${f,,}" in
              *.web.mp4|*.lite.mp4) continue ;;
            esac
            # Only treat it as video if ffprobe finds a video stream
            if ffprobe -v error -select_streams v:0 -show_entries stream=codec_type \
                 -of default=nw=1:nk=1 "$f" 2>/dev/null | grep -q '^video$'; then
              videos+=("$f")
            fi
          done
          if [ "${#videos[@]}" -eq 0 ]; then
            echo "No video files to process."
            exit 0
          fi

          {
            echo "## Web-ready post-process"
            echo ""
            echo "Режим: \`$mode\`"
            echo ""
            echo "| Файл | Видео-кодек | Аудио-кодек | Размер | Действие |"
            echo "| --- | --- | --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for f in "${videos[@]}"; do
            vcodec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$f" 2>/dev/null || echo unknown)
            acodec=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$f" 2>/dev/null || echo none)
            ext="${f##*.}"; ext="${ext,,}"
            sz=$(stat -c%s "$f" 2>/dev/null || echo 0)
            human=$(numfmt --to=iec --suffix=B "$sz")
            base="${f%.*}"
            action=""

            web_friendly=false
            if [ "$vcodec" = "h264" ] && { [ "$acodec" = "aac" ] || [ "$acodec" = "none" ]; } && [ "$ext" = "mp4" ]; then
              web_friendly=true
            fi

            # 1. Remux pass — guarantees moov at the front. Always cheap.
            if [ "$mode" = "remux" ] || [ "$mode" = "both" ]; then
              if $web_friendly; then
                # Same codec, same container — just move moov atom to the front.
                tmp="$(mktemp -u --tmpdir=. "${base}.faststart.XXXX.mp4")"
                if ffmpeg -hide_banner -loglevel warning -y -i "$f" -c copy -movflags +faststart "$tmp" 2>>/tmp/ffmpeg-web.err; then
                  mv "$tmp" "$f"
                  action="remux +faststart"
                else
                  rm -f "$tmp"
                  action="remux failed (см. лог)"
                fi
              else
                # Try a lossless container-only remux to mp4 (works for h264+aac in mkv).
                if [ "$vcodec" = "h264" ] && { [ "$acodec" = "aac" ] || [ "$acodec" = "none" ]; }; then
                  if ffmpeg -hide_banner -loglevel warning -y -i "$f" -c copy -movflags +faststart "${base}.web.mp4" 2>>/tmp/ffmpeg-web.err; then
                    action="sidecar .web.mp4 (lossless remux)"
                  else
                    rm -f "${base}.web.mp4"
                    action="remux failed"
                  fi
                else
                  action="остался как есть (не H.264) → нужен transcode"
                fi
              fi
            fi

            # 2. Transcode pass — guarantees a universally-streamable mp4
            # at 720p H.264 + AAC. Only run when the user asked for it,
            # because this costs real CPU minutes on the runner.
            if [ "$mode" = "transcode" ] || [ "$mode" = "both" ]; then
              # If we just produced a web.mp4 via lossless remux, skip
              # transcoding — that file is already web-streamable.
              if [ -f "${base}.web.mp4" ] && [ "$mode" = "both" ]; then
                action="$action; transcode skipped (есть lossless .web.mp4)"
              elif $web_friendly && [ "$mode" = "transcode" ]; then
                action="transcode skipped (исходник уже H.264 mp4 faststart)"
              else
                # 720p cap, AAC 128k, veryfast for predictable runtime.
                if ffmpeg -hide_banner -loglevel warning -y -i "$f" \
                     -vf "scale='min(1280,iw)':-2" \
                     -c:v libx264 -preset veryfast -crf 23 \
                     -profile:v main -level 4.0 \
                     -pix_fmt yuv420p \
                     -c:a aac -b:a 128k -ac 2 \
                     -movflags +faststart \
                     "${base}.web.mp4" 2>>/tmp/ffmpeg-web.err; then
                  if [ -n "$action" ]; then action="$action; sidecar .web.mp4 (transcode 720p)"; else action="sidecar .web.mp4 (transcode 720p)"; fi
                else
                  rm -f "${base}.web.mp4"
                  action="transcode failed (см. лог)"
                fi
              fi
            fi

            echo "| \`$f\` | \`$vcodec\` | \`$acodec\` | $human | $action |" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ -s /tmp/ffmpeg-web.err ]; then
            {
              echo ""
              echo "<details><summary>ffmpeg stderr (последние 40 строк)</summary>"
              echo ""
              echo '```'
              tail -n 40 /tmp/ffmpeg-web.err
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Decrypt Widevine DRM (Kinopoisk)
        if: steps.detect.outputs.mode == 'ytdlp' && env.WIDEVINE_DECRYPTION_KEY != ''
        env:
          WIDEVINE_DECRYPTION_KEY: ${{ secrets.WIDEVINE_DECRYPTION_KEY }}
          WORK: ${{ steps.workspace.outputs.dir }}
        run: |
          set -euo pipefail
          # This step runs when a WIDEVINE_DECRYPTION_KEY secret is set.
          # The key is a 128-bit hex string (32 chars) obtained via
          # EME hook interception or CDM extraction (KeyDive).
          #
          # yt-dlp downloads the encrypted segments and concatenates them
          # into a single .mp4 file.  ffmpeg with -decryption_key performs
          # lossless AES-128-CTR decryption without re-encoding (-codec copy).
          #
          # If no encrypted .mp4 files are found, this step is a no-op.
          cd "$WORK"
          key="$WIDEVINE_DECRYPTION_KEY"
          decrypted=0
          for f in *.mp4 *.mkv *.m4v *.ts *.m4s; do
            [ -f "$f" ] || continue
            # Check if the file is actually encrypted by probing with ffprobe.
            # Encrypted files typically fail to probe or report "encryption".
            if ffprobe -i "$f" -show_entries format=encryption 2>/dev/null | grep -q "encryption"; then
              out="${f%.*}_decrypted.${f##*.}"
              echo "Decrypting $f → $out (key=${key:0:8}…)"
              ffmpeg -decryption_key "$key" -i "$f" -codec copy "$out"
              rc=$?
              if [ "$rc" -eq 0 ] && [ -f "$out" ]; then
                mv "$out" "$f"
                decrypted=$((decrypted + 1))
              else
                echo "::warning::ffmpeg decryption failed for $f (exit $rc), leaving encrypted file"
                rm -f "$out" 2>/dev/null || true
              fi
            fi
          done
          echo "Decrypted $decrypted file(s)"
          if [ "$decrypted" -gt 0 ]; then
            {
              echo "## Widevine DRM: дешифровка"
              echo ""
              echo "Файлов расшифровано: **$decrypted**"
              echo ""
              echo "Использован ключ AES-128 из секрета \`WIDEVINE_DECRYPTION_KEY\`."
              echo "Дешифровка выполнена через \`ffmpeg -decryption_key -codec copy\` — без потерь качества."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload to Google Drive
        id: upload
        env:
          SUBFOLDER: ${{ inputs.subfolder }}
          WORK: ${{ steps.workspace.outputs.dir }}
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
          TEAM_DRIVE_ID: ${{ steps.drive_detect.outputs.team_drive_id }}
        run: |
          set -euo pipefail
          dest="gdrive:"
          if [ -n "${SUBFOLDER:-}" ]; then
            # rclone will create missing folders
            dest="gdrive:${SUBFOLDER}"
          fi
          # Pre-flight summary so the user can see exactly what's about to
          # be pushed to Drive **before** rclone runs — avoids the "wait,
          # what's that 9a6ad6ac…torrent file in my Drive?" surprise.
          {
            echo "## К загрузке"
            echo ""
            echo "| Файл | Размер | Тип |"
            echo "| --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            sz=$(stat -c%s "$f")
            human=$(numfmt --to=iec --suffix=B "$sz")
            base=$(basename "$f")
            case "${base,,}" in
              *.torrent)        kind="торрент-метаданные (пропускается)" ;;
              *.srt|*.ass|*.vtt|*.sub|*.ssa) kind="субтитры" ;;
              *.mp4|*.mkv|*.avi|*.mov|*.m4v|*.webm) kind="видео" ;;
              *.mp3|*.m4a|*.flac|*.wav|*.ogg|*.opus) kind="аудио" ;;
              *.zip|*.rar|*.7z|*.iso) kind="архив/образ" ;;
              *.jpg|*.jpeg|*.png|*.webp) kind="обложка" ;;
              *)                kind="другое" ;;
            esac
            echo "| \`$base\` | $human | $kind |" >> "$GITHUB_STEP_SUMMARY"
          done < <(find "$WORK" -type f | sort)
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Uploading $WORK -> $dest (auth: $AUTH_MODE)"
          set +e
          # Knobs vs. defaults, with reasoning:
          #   * --transfers 4 (was 8): with 8 parallel chunked uploads we hit
          #     Drive's per-file commit step in lock-step and every retry
          #     burned bandwidth re-uploading 1+ GiB. 4 is the sweet spot.
          #   * --drive-chunk-size 256M (was 128M): fewer round-trips per file,
          #     and Drive's resumable-upload commit is the slow part — so
          #     bigger chunks = fewer commit waits per file.
          #   * --tpslimit 10 + --tpslimit-burst 20: cap Drive API calls at
          #     10/sec to stay well below Google's anti-abuse "Queries per
          #     minute" limit. New Cloud projects (which is what every user
          #     of the in-app device-flow has) can be silently throttled
          #     below the displayed `defaultPerMinutePerProject = 840000`
          #     budget if they look like they're abusing — see run 25568128727.
          #   * --retries 3 + --retries-sleep 60s: a transient `rateLimitExceeded`
          #     on the very first list call must not kill the whole Заброс.
          #     60-second sleep gives Drive's per-minute counter time to
          #     reset before we try again. rclone's `copy` is idempotent —
          #     files already on Drive are skipped by hash on retry, so
          #     this does NOT cause the original "second cycle" 1.46-GiB
          #     re-upload (that was about a hung commit, mitigated below).
          #   * --low-level-retries 10 (default): chunk-level pacer
          #     handles 403 backoff for individual chunks.
          #   * --max-duration 4h: hard ceiling so a hung commit can't keep
          #     the runner alive for the full 350-minute job timeout. With
          #     3 high-level retries x 60s sleep that's at most +3min of
          #     overhead, well within the 4h ceiling.
          #   * --drive-stop-on-upload-limit: bail immediately on quota
          #     errors instead of retrying.
          #   * --drive-acknowledge-abuse=true: don't fail on Drive's "this
          #     file may be infected" warning for big AVIs.
          #   * --exclude-from /tmp/rclone.exclude: skip torrent metadata
          #     and aria2 control files. The .torrent itself is useless on
          #     Drive (the user asked "что это" about
          #     `9a6ad6ac…torrent` in the previous run).
          # Use printf rather than a heredoc — YAML block-scalar indentation
          # would otherwise leak into the exclude file and rclone would
          # silently never match `          *.torrent`.
          printf '%s\n' '*.torrent' '*.aria2' '*.aria2.tmp' '.DS_Store' 'Thumbs.db' \
            > /tmp/rclone.exclude
          rclone --config "$HOME/.config/rclone/rclone.conf" \
            copy "$WORK" "$dest" \
            --transfers 4 \
            --checkers 8 \
            --drive-chunk-size 256M \
            --drive-upload-cutoff 256M \
            --drive-acknowledge-abuse=true \
            --drive-stop-on-upload-limit \
            --tpslimit 10 \
            --tpslimit-burst 20 \
            --retries 3 \
            --retries-sleep 60s \
            --low-level-retries 10 \
            --max-duration 4h \
            --exclude-from /tmp/rclone.exclude \
            --stats 10s \
            --stats-one-line \
            --progress=false \
            --log-level INFO 2> >(tee /tmp/rclone.err >&2)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            if grep -qE 'rateLimitExceeded|RATE_LIMIT_EXCEEDED|userRateLimitExceeded' /tmp/rclone.err 2>/dev/null; then
              # Pull out the Cloud project_number from the JSON Google
              # returns so we can deep-link the user straight to *their*
              # project's quota page. Falls back to a generic link if the
              # number can't be parsed.
              proj=$(grep -oE '"consumer":[[:space:]]*"projects/[0-9]+"' /tmp/rclone.err 2>/dev/null \
                | head -n1 \
                | grep -oE '[0-9]+' || true)
              proj_query=""
              if [ -n "$proj" ]; then
                proj_query="?project=$proj"
              fi
              {
                echo "## Загрузка упала: rateLimitExceeded"
                echo ""
                echo "Drive API ответил **\`Quota exceeded for quota metric Queries per minute\`**"
                echo "для твоего OAuth-проекта в Google Cloud."
                echo ""
                echo "Это не значит что место кончилось — это анти-абьюз: новые GCP-проекты"
                echo "Google режет до низкой частоты запросов, особенно если до этого было"
                echo "много неудачных попыток (как у нас с retry-петлёй ранее)."
                echo ""
                echo "Что сделать:"
                echo ""
                echo "1. **Подождать 30–60 минут** — счётчик Drive API сбрасывается раз в минуту,"
                echo "   а анти-абьюз обычно снимается в течение часа после простоя."
                echo "2. **ИЛИ включить Billing на проекте** (бесплатно для Drive API,"
                echo "   карту не списывают). Это снимает с проекта пометку «новый» и"
                echo "   возвращает базовый лимит:"
                echo "   - https://console.cloud.google.com/billing/linkedaccount${proj_query}"
                echo "3. **ИЛИ запросить увеличение лимита** (только если правда нужно >300/сек):"
                echo "   - https://console.cloud.google.com/iam-admin/quotas${proj_query}"
                echo ""
                if [ -n "$proj" ]; then
                  echo "Твой Cloud project_number: \`$proj\`"
                else
                  echo "_Не удалось извлечь project_number из ответа Google — открой Cloud Console вручную._"
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Drive: rateLimitExceeded::Drive API ограничил твой OAuth-проект. Подожди 30–60 мин или включи Billing в Cloud Console (см. Step Summary)."
              exit "$rc"
            fi
            if grep -q 'storageQuotaExceeded' /tmp/rclone.err 2>/dev/null; then
              {
                echo "## Загрузка упала: storageQuotaExceeded"
                echo ""
                if [ "$AUTH_MODE" = "oauth" ]; then
                  echo "Drive вернул \`storageQuotaExceeded\` — у владельца refresh-токена"
                  echo "закончилось место в личном Google Drive."
                  echo ""
                  echo "Что сделать:"
                  echo "1. Освободить место (Корзина, большие файлы) или докупить Google One: https://one.google.com"
                  echo "2. Либо перевыпустить refresh token под другой Google-аккаунт: \`rclone authorize \"drive\"\` и обновить секрет \`GDRIVE_OAUTH_TOKEN\` через UI приложения."
                else
                  echo "У сервис-аккаунтов **нет своей квоты Google Drive**."
                  echo "Загрузка возможна только в **Shared Drive (Общий диск)** —"
                  echo "там байтами «владеет» сам Shared Drive, а не SA."
                  echo ""
                  if [ -z "${TEAM_DRIVE_ID:-}" ]; then
                    echo "Сейчас целевая папка \`GDRIVE_FOLDER_ID\` лежит в **My Drive**, поэтому SA пишет в свою (нулевую) квоту."
                    echo ""
                  fi
                  echo "Варианты:"
                  echo "- **Личный @gmail.com** — переключись на OAuth: открой Настройки в приложении и используй блок «OAuth refresh token». Shared Drive в личном Google создать нельзя."
                  echo "- **Google Workspace** — создай Shared Drive: https://drive.google.com/drive/shared-drives, добавь сервис-аккаунт как Content manager, перенеси папку внутрь и обнови \`GDRIVE_FOLDER_ID\`."
                  echo ""
                  echo "Документация Google: https://developers.google.com/workspace/drive/api/guides/about-shareddrives"
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "$AUTH_MODE" = "oauth" ]; then
                echo "::error title=Drive: storageQuotaExceeded::Закончилось место в личном Drive у владельца refresh-токена."
              else
                echo "::error title=Drive: storageQuotaExceeded::Сервис-аккаунту запретили запись. Личный Google → используй OAuth; Workspace → нужен Shared Drive (см. Step Summary)."
              fi
            fi
            exit "$rc"
          fi

          {
            echo "## Загружено в Drive"
            echo ""
            echo "| Файл | Размер | Тип |"
            echo "| --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            base=$(basename "$f")
            # Mirror the pre-flight exclude list — these never reach Drive,
            # so they shouldn't show up in the "Загружено" summary either.
            case "${base,,}" in
              *.torrent|*.aria2|*.aria2.tmp|.ds_store|thumbs.db) continue ;;
            esac
            sz=$(stat -c%s "$f")
            human=$(numfmt --to=iec --suffix=B "$sz")
            case "${base,,}" in
              *.srt|*.ass|*.vtt|*.sub|*.ssa) kind="субтитры" ;;
              *.mp4|*.mkv|*.avi|*.mov|*.m4v|*.webm) kind="видео" ;;
              *.mp3|*.m4a|*.flac|*.wav|*.ogg|*.opus) kind="аудио" ;;
              *.zip|*.rar|*.7z|*.iso) kind="архив/образ" ;;
              *.jpg|*.jpeg|*.png|*.webp) kind="обложка" ;;
              *)                kind="другое" ;;
            esac
            echo "| \`$base\` | $human | $kind |" >> "$GITHUB_STEP_SUMMARY"
          done < <(find "$WORK" -type f | sort)

      - name: Cleanup
        if: always()
        run: |
          rm -f "$HOME/.config/rclone/sa.json" "$HOME/.config/rclone/rclone.conf" /tmp/rclone.err || true
          rm -rf "$RUNNER_TEMP/beam" || true
