name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          python3 -c "import yaml,sys,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]"

      - name: HTML / JS / CSS sanity (no broken references)
        run: |
          set -euo pipefail
          # All href/src refs in docs/index.html exist (relative ones only).
          # Strip query strings (?v=...) and fragments (#...) since those are
          # cache-busting / anchor hints, not part of the on-disk filename.
          missing=0
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            if [[ "$ref" =~ ^(https?:|data:|mailto:|#) ]]; then
              continue
            fi
            clean="${ref%%\?*}"
            clean="${clean%%#*}"
            [ -z "$clean" ] && continue
            path="docs/${clean#./}"
            if [ ! -f "$path" ]; then
              echo "::error file=docs/index.html::missing referenced file: $ref"
              missing=$((missing + 1))
            fi
          done < <(grep -oE '(href|src)="[^"]+"' docs/index.html | sed -E 's/.*="([^"]+)"/\1/')
          if [ "$missing" -gt 0 ]; then exit 1; fi

      - name: JS syntax check
        run: |
          set -euo pipefail
          node --check docs/app.js
          # The service worker is a separate top-level script; previously it
          # was excluded from the syntax check, so a typo in sw.js would
          # silently ship to production and break offline support.
          node --check docs/sw.js

      - name: Vendor bundle present
        run: |
          set -euo pipefail
          # sw.js's SHELL_STATIC precaches these files. If they're missing on
          # disk, install would silently fail (best-effort) and the page
          # would 404 on libsodium during secret upload.
          for f in docs/vendor/libsodium-sumo.min.js docs/vendor/libsodium-wrappers.min.js; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::vendor bundle missing — service worker SHELL_STATIC references it"
              exit 1
            fi
          done

      - name: Python syntax check
        run: |
          set -euo pipefail
          python3 -m py_compile $(git ls-files 'scripts/**/*.py')
